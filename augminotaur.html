<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Augminotaur</title>
<style>
  :root{
    --stone-0:#0e1116;
    --stone-1:#161b23;
    --stone-2:#222a35;
    --stone-3:#36414f;
    --bone:#ded6c6;
    --dust:#828d9d;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:#000; color:var(--bone);
    overflow:hidden;
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    overscroll-behavior:none;
  }

  #app{
    height:100%;
    max-width:560px;              /* keep the phone frame sane on desktop */
    margin:0 auto;
    display:flex; flex-direction:column;
    background:var(--stone-0);
  }

  /* ---- viewport ---- */
  .screen{ position:relative; width:100%; }
  #view{
    display:block; width:100%; height:auto;
    aspect-ratio:320 / 200;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#000;
    border-bottom:1px solid var(--stone-2);
  }
  #fps{
    position:absolute; top:6px; left:8px;
    font-size:11px; letter-spacing:.08em;
    color:var(--dust); text-shadow:0 1px 2px #000;
    pointer-events:none;
  }

  /* ---- controls ---- */
  .pad{
    flex:1;
    display:flex; gap:8px;
    padding:12px;
    min-height:120px;
  }
  .pad button{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    font-size:34px; line-height:1;
    color:var(--bone);
    background:var(--stone-1);
    border:1px solid var(--stone-3);
    border-radius:8px;
    cursor:pointer;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  .pad button:active{ background:var(--stone-2); }
  #btn-fwd{ flex:1.3; }

  .hint{
    text-align:center; color:var(--dust);
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    padding:0 12px 10px;
  }

  /* ---- debug verb readout (toggles with fps) ---- */
  #verb{
    position:absolute; top:6px; right:8px;
    font-size:13px; letter-spacing:.14em; font-weight:600;
    color:var(--bone); text-shadow:0 1px 2px #000;
    pointer-events:none;
  }
  /* ---- dev fight readout: pattern + your hits (toggles with fps) ---- */
  #dbg{
    position:absolute; left:8px; bottom:6px;
    font-size:10px; line-height:1.35; white-space:pre;
    color:var(--dust); text-shadow:0 1px 2px #000;
    pointer-events:none;
  }

  /* ---- entry / calibration overlay ---- */
  #entry{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:22px; padding:32px;
    text-align:center;
    background:radial-gradient(120% 90% at 50% 40%, var(--stone-1), #000 90%);
    transition:opacity .6s ease;
  }
  #entry.ready-tap{ cursor:pointer; }
  #entry.gone{ opacity:0; pointer-events:none; }
  #entry-title{
    font-size:26px; letter-spacing:.42em; font-weight:600;
    color:var(--bone); text-indent:.42em;              /* balance the tracking */
    min-height:1.2em;
  }
  #entry-prompt{
    font-size:15px; letter-spacing:.06em; color:var(--bone);
    min-height:1.3em;
  }
  #entry-sub{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--dust); min-height:1.3em;
  }
  #entry.ready-tap #entry-prompt{ animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
</style>
</head>
<body>
<div id="app">
  <div class="screen">
    <canvas id="view"></canvas>
    <div id="fps">— fps</div>
    <div id="verb"></div>
    <div id="dbg"></div>
    <div id="entry">
      <div id="entry-title">AUGMINOTAUR</div>
      <div id="entry-prompt">tap to descend</div>
      <div id="entry-sub">headphones recommended</div>
    </div>
  </div>
  <div class="pad">
    <button id="btn-left"  aria-label="Turn left">◀</button>
    <button id="btn-fwd"   aria-label="Step forward">▲</button>
    <button id="btn-right" aria-label="Turn right">▶</button>
  </div>
  <p class="hint">Arrows / WASD on desktop · F toggles fps</p>
</div>
<script type="module" src="augminotaur/main.js"></script>
</body>
</html>
