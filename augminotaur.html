<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Augminotaur</title>
<style>
  :root{
    --stone-0:#0e1116;
    --stone-1:#161b23;
    --stone-2:#222a35;
    --stone-3:#36414f;
    --bone:#ded6c6;
    --dust:#828d9d;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:#000; color:var(--bone);
    overflow:hidden;
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    overscroll-behavior:none;
  }

  #app{
    height:100%;
    max-width:560px;              /* keep the phone frame sane on desktop */
    margin:0 auto;
    display:flex; flex-direction:column;
    background:var(--stone-0);
  }

  /* ---- viewport ---- */
  .screen{ position:relative; width:100%; }
  #view{
    display:block; width:100%; height:auto;
    aspect-ratio:320 / 200;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#000;
    border-bottom:1px solid var(--stone-2);
  }
  #fps{
    position:absolute; top:6px; left:8px;
    font-size:11px; letter-spacing:.08em;
    color:var(--dust); text-shadow:0 1px 2px #000;
    pointer-events:none;
  }

  /* ---- controls ---- */
  .pad{
    flex:1;
    display:flex; gap:8px;
    padding:12px;
    min-height:120px;
  }
  .pad button{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    font-size:34px; line-height:1;
    color:var(--bone);
    background:var(--stone-1);
    border:1px solid var(--stone-3);
    border-radius:8px;
    cursor:pointer;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  .pad button:active{ background:var(--stone-2); }
  #btn-fwd{ flex:1.3; }

  .hint{
    text-align:center; color:var(--dust);
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    padding:0 12px 10px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="screen">
    <canvas id="view"></canvas>
    <div id="fps">— fps</div>
  </div>
  <div class="pad">
    <button id="btn-left"  aria-label="Turn left">◀</button>
    <button id="btn-fwd"   aria-label="Step forward">▲</button>
    <button id="btn-right" aria-label="Turn right">▶</button>
  </div>
  <p class="hint">Arrows / WASD on desktop · F toggles fps</p>
</div>
<script type="module" src="augminotaur/main.js"></script>
</body>
</html>
